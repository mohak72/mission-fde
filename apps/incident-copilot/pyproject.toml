[project]
name = "incident-copilot"
version = "0.1.0"
description = "M1: Alert -> runbook RAG -> kubectl investigate -> propose -> human approves."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings>=2.7,<2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "ruff>=0.8,<0.9",
    "bandit>=1.8,<1.9",
    "pip-audit>=2.7,<2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
