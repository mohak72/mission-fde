[project]
name = "incident-copilot"
version = "0.1.0"
description = "M1: Alert -> runbook RAG -> kubectl investigate -> propose -> human approves."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings>=2.7,<2.8",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.18,<1.19",
    "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14,<3.15",
    "httpx>=0.27",
    "ruff>=0.8,<0.9",
    "bandit>=1.8,<1.9",
    "pip-audit>=2.7,<2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: asserts are how pytest works. B008: FastAPI's Depends(...)-as-default is the
# documented idiom (https://fastapi.tiangolo.com/tutorial/dependencies/), not a real bug.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic-templated revision scripts follow Alembic's own generated style, not ours.
"src/incident_copilot/persistence/migrations/versions/*.py" = ["E501", "I001", "UP035", "UP007"]
# Test fixture strings that look like secrets are not secrets.
"tests/**/*.py" = ["S105", "S106", "S107"]

[tool.bandit]
exclude_dirs = ["tests", "src/incident_copilot/persistence/migrations"]
