services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: incident_copilot
      POSTGRES_PASSWORD: incident_copilot
      POSTGRES_DB: incident_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
