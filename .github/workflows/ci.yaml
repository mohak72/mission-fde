name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [apps/incident-copilot, platform]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
        working-directory: ${{ matrix.package }}
      - name: ruff
        run: uv run ruff check .
        working-directory: ${{ matrix.package }}
      - name: bandit
        run: uv run bandit -r src -c pyproject.toml
        working-directory: ${{ matrix.package }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [apps/incident-copilot, platform]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
        working-directory: ${{ matrix.package }}
      - name: pytest (unit)
        run: uv run pytest tests/unit
        working-directory: ${{ matrix.package }}

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incident_copilot
          POSTGRES_PASSWORD: incident_copilot
          POSTGRES_DB: incident_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
        working-directory: apps/incident-copilot
      - name: pytest (integration)
        run: uv run pytest tests/integration
        working-directory: apps/incident-copilot

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [apps/incident-copilot, platform]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
        working-directory: ${{ matrix.package }}
      - name: pip-audit (incident-copilot)
        if: matrix.package == 'apps/incident-copilot'
        # chromadb has 4 open advisories as of 2026-11-06 with no fix version
        # available: PYSEC-2026-311 (CVE-2026-45829, pre-auth RCE via Chroma's
        # bundled FastAPI HTTP server) and PYSEC-2026-3813/3814/3815 (cross-tenant
        # RBAC/authorization bypasses in that same server). This project never runs
        # that server -- retrieval/chroma_backend.py uses chromadb.PersistentClient,
        # embedded and in-process, no network listener, no multi-tenant auth surface.
        # Re-check this ignore list if chromadb ships a fix, or if the backend ever
        # moves off the embedded client (see Story 1.3 Completion Notes).
        run: >-
          uv run pip-audit
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
        working-directory: apps/incident-copilot
      - name: pip-audit (platform)
        if: matrix.package == 'platform'
        run: uv run pip-audit
        working-directory: platform
