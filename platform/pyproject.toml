[project]
name = "platform-core"
version = "0.1.0"
description = "Shared platform: LLM gateway (rate limit + cache) and tracing, reused by M1-M6."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43,<1.44",
    "pydantic-settings>=2.7,<2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8,<0.9",
    "bandit>=1.8,<1.9",
    "pip-audit>=2.7,<2.8",
    "pytest-mock>=3.14,<3.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
