schema: 1
story: '1.2'
story_title: 'Alert Ingestion Webhook'
gate: CONCERNS
status_reason: >-
  Core functionality is correct and well-tested (atomic dedup proven against real
  Postgres, signature verification uses constant-time comparison, repository pattern
  respected). Two medium-severity testing gaps keep this from a clean PASS: the
  signature-before-parsing order (NFR9 AC4) is only verified manually via curl, not
  by an automated regression test, and no integration test exercises the full
  webhook route end-to-end against a real database. Neither blocks merge; both are
  cheap to close in a short follow-up.
reviewer: 'Quinn (Test Architect)'
updated: '2026-11-06T00:00:00Z'

top_issues:
  - id: 1.2-01
    severity: medium
    finding: >-
      No automated test proves signature verification happens strictly before
      JSON parsing. This was verified manually (curl with a bogus-signature +
      malformed body returning 401, not 400) but that proof doesn't persist in
      the test suite — a future refactor could silently invert the order and
      no CI check would catch it.
    suggested_owner: dev
    refs:
      - apps/incident-copilot/tests/unit/test_webhook.py
      - apps/incident-copilot/src/incident_copilot/api/webhook.py
  - id: 1.2-02
    severity: medium
    finding: >-
      The only integration test (test_alert_dedup.py) exercises AlertRepository
      directly; nothing in the integration tier posts to the real /webhook/alert
      route against a live DB (dependency override is used in all webhook tests).
      The full signature-verify -> parse -> persist chain has only been proven
      manually, not by an automated, repeatable test.
    suggested_owner: dev
    refs:
      - apps/incident-copilot/tests/integration/test_alert_dedup.py
      - apps/incident-copilot/src/incident_copilot/api/webhook.py
  - id: 1.2-03
    severity: low
    finding: >-
      AlertRepository.insert_if_new always does an INSERT...RETURNING followed
      by a separate SELECT, even on the non-conflict path where RETURNING could
      have supplied the full row directly. Minor extra round-trip per request,
      not a functional issue.
    suggested_owner: dev
    refs:
      - apps/incident-copilot/src/incident_copilot/persistence/repositories.py
  - id: 1.2-04
    severity: low
    finding: >-
      test_alert_dedup.py asserts row count and id equality but not that the
      persisted `payload` column actually matches what was passed in -- AC2's
      "persisted (id, payload, received_at)" isn't fully asserted at the data
      level.
    suggested_owner: dev
    refs:
      - apps/incident-copilot/tests/integration/test_alert_dedup.py

