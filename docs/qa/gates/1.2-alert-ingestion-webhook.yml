nfr_validation:
  security:
    status: PASS
    notes: >-
      HMAC-SHA256 verified via hmac.compare_digest (constant-time, no timing
      side-channel). Secret and DB URL read through pydantic-settings, never
      hardcoded or read via os.environ directly. Dev-default secret is clearly
      marked insecure-placeholder and overridden via .env. Parameterized
      queries throughout (SQLAlchemy ORM) -- no injection surface. Replay of a
      validly-signed request is harmless by construction (dedup is idempotent).
  performance:
    status: PASS
    notes: >-
      No NFR performance target defined for this story. insert_if_new's extra
      round-trip (1.2-03) is negligible at expected M1 volume; flagged as a
      future nice-to-have, not a current concern.
  reliability:
    status: CONCERNS
    notes: >-
      Functionally correct and manually verified end-to-end, but two of the
      four verification paths (signature-before-parse ordering, full route-level
      DB integration) rely on manual verification rather than an automated,
      regression-proof test (1.2-01, 1.2-02).
  maintainability:
    status: PASS
    notes: >-
      Repository pattern strictly respected (AlertRepository is the only module
      touching `alerts`). Clean separation: auth.py / schemas.py / ingestion
      entrypoint / api route. Type hints on all public signatures. Comments
      used only where they explain non-obvious WHY (dedup atomicity, signature
      ordering), not restating WHAT. Deviation from story's literal "mock
      AlertRepository" instruction in unit tests was disclosed, not silent.

recommendations:
  immediate: []
  future:
    - action: >-
        Add a unit test asserting a bogus-signature request with a malformed
        body returns 401 (not 400), locking in NFR9's "signature verified
        before any processing" ordering as a permanent regression check.
      refs: ['apps/incident-copilot/tests/unit/test_webhook.py']
    - action: >-
        Add an integration test that posts to the real /webhook/alert route
        (no dependency override) against the live test Postgres, covering the
        full signature -> parse -> persist chain in one automated test.
      refs: ['apps/incident-copilot/tests/integration/']
    - action: >-
        Consider having insert_if_new's RETURNING clause return full row data
        on the insert path, avoiding the extra SELECT round-trip.
      refs: ['apps/incident-copilot/src/incident_copilot/persistence/repositories.py']
    - action: >-
        Extend test_alert_dedup.py to assert the persisted payload column
        content matches the input, not just row count/id.
      refs: ['apps/incident-copilot/tests/integration/test_alert_dedup.py']
