schema: 1
story: "2.2"
story_title: "LangGraph State Machine Refactor"
gate: CONCERNS
status_reason: >
  All four ACs are met on the happy path and the one Dev-flagged edge case
  (no-match result). Independent re-run of lint/security/unit/integration
  all green, matching Dev's self-report. However, independent reproduction
  found a real reliability gap in run_pipeline's failure-recovery path
  (REL-003, medium-high) that the existing test suite structurally cannot
  catch, because its only failure-path test fully mocks PipelineRunRepository.
reviewer: "Quinn (Test Architect)"
updated: "2026-11-10T18:00:00Z"

waiver: { active: false }

top_issues:
  - id: "REL-003"
    severity: medium-high
    finding: >
      run_pipeline's except block calls run_repo.mark_failed(run.id) on the
      same SQLAlchemy Session that was active when the original exception
      was raised. If that exception came from a failed SQL statement on this
      session (an IntegrityError from DiagnosisProposalRepository.create(),
      an OperationalError from a transient DB connection blip during any
      repository .commit() mid-run, etc.), the session is left in SQLAlchemy's
      "pending rollback" state. The recovery call then itself raises
      sqlalchemy.exc.PendingRollbackError, which is NOT caught -- it escapes
      run_pipeline uncaught, directly violating this story's own stated
      contract ("re-raises nothing further... never a silent swallow",
      architecture/error-handling-strategy.md#error-propagation) and AC4's
      implicit promise that a failed run always ends up in an inspectable
      PipelineRun(status='failed') row. Reproduced independently against a
      real Postgres session: forcing a NOT NULL violation on
      DiagnosisProposalRepository.create() and then calling mark_failed() on
      the same session raises PendingRollbackError every time. The existing
      failure-path test (tests/unit/graph/test_pipeline.py::
      test_run_pipeline_marks_failed_and_returns_run_on_node_exception) uses
      a fully-mocked PipelineRunRepository, so it cannot exercise this path --
      it only proves a non-DB exception (RuntimeError from a node) is handled,
      never a DB-originated one.
    suggested_action: >
      In run_pipeline's except block, call session.rollback() before
      run_repo.mark_failed(run.id) (rollback on an already-clean session is
      a safe no-op, so this is correct regardless of whether the original
      exception was DB-related). Add an integration-level regression test
      (real session, not mocked) that forces a DB-level failure mid-run
      (e.g. the same NOT NULL violation used in this review) and asserts
      run_pipeline returns a PipelineRun(status='failed') rather than
      raising.
    suggested_owner: dev
  - id: "PROC-002"
    severity: low
    finding: >
      logger.exception("pipeline_run_failed") in run_pipeline's except block
      does not include which node was executing when the exception was
      raised. The traceback (captured via structlog's exc_info) will usually
      show the failing node's function name, but AC4's "replayable from the
      log alone" promise would be more directly satisfied with an explicit
      node_name field on this log line, consistent with the node_transition
      log line's own node_name field.
    suggested_action: >
      Track the current node name (e.g. via the last chunk's key before the
      exception, or a small wrapper) and pass it as a bound field on the
      pipeline_run_failed log line.
    suggested_owner: dev

risk_summary:
  totals: { critical: 0, high: 0, medium: 1, low: 1 }
  recommendations:
    must_fix:
      - "REL-003: add session.rollback() before mark_failed() in run_pipeline's except block, plus a real-session regression test."
    monitor:
      - "PROC-002: node_name on the failure log line (nice-to-have, not blocking)."

