schema: 1
story: "2.3"
story_title: "Read-Only kubectl Evidence Grounding"
gate: PASS
status_reason: >
  REL-004 fixed and independently re-verified, not just re-read. Confirmed
  via actual MRO inspection in the installed urllib3 build that
  MaxRetryError and ReadTimeoutError are both genuine subclasses of
  urllib3.exceptions.HTTPError, so the broadened except clause in
  get_evidence() now catches what a real Kubernetes client timeout
  actually raises. Investigated the breadth concern this fix raises
  (catching the common HTTPError base is wide) by reading the installed
  kubernetes client's rest.py directly: it already intercepts
  urllib3.exceptions.SSLError internally and converts it to ApiException
  before it would ever reach our code, so that specific risk doesn't
  apply; every other HTTPError subclass that can still reach
  get_evidence() raw (connection timeouts, DNS failures, connection
  resets, malformed-URL errors from bad alert-label data) represents a
  genuine "cluster/tool call failed" condition, which is exactly what
  AC4 says must degrade gracefully rather than fail the whole pipeline --
  so the broader catch is the more correct implementation of AC4's intent,
  not an overreach. Verified the new regression test
  (test_get_evidence_raises_cluster_evidence_error_on_real_urllib3_timeout)
  constructs MaxRetryError/ReadTimeoutError with realistic constructor
  args (confirmed by constructing them directly in a REPL), not something
  that only superficially passes an isinstance check. Independently
  re-ran the full suite: ruff clean, bandit clean, 45 unit passed,
  6 integration passed + 2 correctly skipped (no local kind cluster,
  unchanged from before -- not a regression). Spot-checked the two other
  exception paths in this module (ApiException translation, and the
  no-resource-identifiable short-circuit) for regressions from this
  change -- neither was touched by the fix and both still behave as
  originally verified.
