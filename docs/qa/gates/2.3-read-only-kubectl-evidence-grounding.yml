schema: 1
story: "2.3"
story_title: "Read-Only kubectl Evidence Grounding"
gate: CONCERNS
status_reason: >
  AC1-3 (pod/deployment describe, read-only-only enforcement, live-evidence
  citation in the proposal) verified sound, including an independent static
  check that the kind-cluster CI job and the propose.py default-preserving
  change both work as claimed. AC4's "or times out" clause is not actually
  satisfied: get_evidence()'s except clauses (ApiException, builtin
  TimeoutError) do not match what the real kubernetes/urllib3 client raises
  on a request timeout (urllib3.exceptions.MaxRetryError / ReadTimeoutError,
  which do NOT subclass the builtin TimeoutError). Reproduced independently
  with a direct repro against the real module: a mocked MaxRetryError leaks
  straight out of get_evidence(), uncaught by ClusterEvidenceError, uncaught
  by investigate.py, and would be caught only by run_pipeline's outer
  except Exception -- marking the whole run failed, which is exactly what
  AC4 says must not happen. The project's own existing unit test for this
  path is a tautology: it mocks side_effect=TimeoutError(...) (the builtin),
  i.e. it tests that the except clause catches what it was written to catch,
  not what a real timeout actually raises -- same root-cause shape as
  Story 2.1 REL-001 and Story 2.2 REL-003.
reviewer: "Quinn (Test Architect)"
updated: "2026-11-14T16:30:00Z"

waiver: { active: false }

top_issues:
  - id: "REL-004"
    severity: high
    finding: >
      get_evidence() in cluster/evidence.py catches `ApiException` and the
      builtin `TimeoutError`, but a real Kubernetes API request timeout
      (via `_request_timeout`) raises `urllib3.exceptions.MaxRetryError` or
      `urllib3.exceptions.ReadTimeoutError` -- neither subclasses
      `ApiException` nor Python's builtin `TimeoutError` (confirmed via MRO
      inspection and a direct repro: a mocked MaxRetryError propagates as a
      raw urllib3 exception out of get_evidence(), past investigate.py's
      `except ClusterEvidenceError`, and is only caught by run_pipeline's
      outer handler -- which marks the entire run FAILED). This breaks
      AC4's explicit "or times out" guarantee: a slow/hung cluster call
      fails the whole pipeline instead of degrading gracefully. The
      existing unit test (test_get_evidence_raises_cluster_evidence_error_on_timeout)
      does not catch this because it mocks the builtin TimeoutError rather
      than a real urllib3 timeout exception.
    suggested_action: >
      Catch `urllib3.exceptions.MaxRetryError` and
      `urllib3.exceptions.ReadTimeoutError` (or more simply, broaden the
      except clause in get_evidence() to translate any exception from the
      three Kubernetes API calls into ClusterEvidenceError, since this
      module's whole purpose is to be the SDK-exception translation
      boundary) and update/replace the existing timeout unit test to mock
      a real urllib3 timeout exception, not the builtin TimeoutError.
    suggested_owner: dev

